name: Generate Posts Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**/meta.json'   # Triggers when any post's meta.json is added or changed

jobs:
  posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate posts.json
        run: node scripts/generate-posts.js

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/posts.json
          git diff --cached --quiet || git commit -m "chore: regenerate posts.json"
          git push
