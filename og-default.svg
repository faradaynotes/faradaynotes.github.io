<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fafaf7"/>

  <!-- Subtle warm border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#ddddd5" stroke-width="1"/>

  <!-- Red accent bar top -->
  <rect x="40" y="40" width="120" height="4" fill="#c0392b"/>

  <!-- FN monogram top-left -->
  <text x="68" y="110" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#1a1a18" letter-spacing="-1">F<tspan fill="#c0392b">N</tspan></text>

  <!-- Divider line -->
  <line x1="68" y1="130" x2="1132" y2="130" stroke="#ddddd5" stroke-width="1"/>

  <!-- Main title -->
  <text x="600" y="290" font-family="Georgia, serif" font-size="82" font-weight="600" fill="#1a1a18" text-anchor="middle" letter-spacing="-2">Faraday <tspan fill="#c0392b">Notes</tspan></text>

  <!-- Tagline -->
  <text x="600" y="360" font-family="Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#4a4a44" text-anchor="middle">Independent analysis of battery technology, electrochemistry,</text>
  <text x="600" y="392" font-family="Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#4a4a44" text-anchor="middle">and the future of energy storage</text>

  <!-- Red accent rule -->
  <rect x="530" y="428" width="140" height="2" fill="#c0392b"/>

  <!-- Topic pills row -->
  <text x="600" y="490" font-family="monospace" font-size="13" fill="#8a8a82" text-anchor="middle" letter-spacing="3">SODIUM-ION · SOLID-STATE · DEGRADATION · ELECTROLYTES · OPEN DATA</text>

  <!-- Bottom rule -->
  <line x1="68" y1="530" x2="1132" y2="530" stroke="#ddddd5" stroke-width="1"/>

  <!-- URL bottom -->
  <text x="600" y="562" font-family="monospace" font-size="16" fill="#8a8a82" text-anchor="middle" letter-spacing="2">FARADAYNOTES.COM</text>
</svg>
